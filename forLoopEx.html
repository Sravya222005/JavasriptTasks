<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>For Loop Examples</title>
    <style>
        body {
            margin: 0;
            padding: 40px;
            background-color: #f4f6f8;
            font-family: Arial, sans-serif;
        }
        h1 {
            text-align: center;
            color: #333;
        }
        .container {
            width: 500px;
            margin: 30px auto;
        }
        .box {
            background-color: white;
            padding: 25px;
            margin-bottom: 20px;
            border: 1px solid #ccc;
            border-radius: 10px;
            box-shadow: 0 2px 6px #ddd;
        }
        h3 {
            margin-top: 0;
            color: #536d8a;
        }
        button {
            padding: 9px 18px;
            border: 1px solid #6c8ebf;
            border-radius: 5px;
            background-color: #eef3fa;
            cursor: pointer;
        }
        button:hover {
            background-color: #dce7f5;
        }
     
    </style>
</head>
<body>
    <h1>For Loop Examples</h1>
    <div class="container">
        <div class="box">
            <h3>1. Print Sequence</h3>            
            <button onclick="printSequence()">Print</button>
            <p id="result1"></p>
        </div>
        <div class="box">
            <h3>2. Sum of 10 Natural Numbers</h3>
            <button onclick="sumNatural()">Calculate</button>
            <p id="result2"></p>
        </div>
    </div>
    <script type="text/javascript"  src="forLoopEx.js"></script>
    
</body>
</html>

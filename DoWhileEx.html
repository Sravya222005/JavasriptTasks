<!DOCTYPE html>
<html>
<head>
    <title>Do While Examples</title>
    <style>
        body {
            font-family: Arial;
            background-color: #f4f6f8;
        }
        #heading{
            text-align: center;
            text-decoration: underline;
            color: cadetblue;
        }
        .container {
            width: 500px;
            margin: 50px auto;
        }
        .box {
            background-color: white;
            padding: 20px;
            margin-bottom: 20px;
            border: 1px solid #ddd;
        }
        button {
            padding: 8px 15px;
            border-radius: 10px;
        }
        p {
            font-weight: bold;
        }
    </style>
</head>
<body>
    <h2 id="heading">Examples of do while</h2>
<div class="container">
    <div class="box">
        <h2>Print 1 to 5</h2>
        <button onclick="printNumbers()">Print</button>
        <p id="result1"></p>
    </div>
    <div class="box">
        <h2>Even Numbers</h2>
        <button onclick="evenNumbers()">Print</button>
        <p id="result2"></p>
    </div>
</div>
<script type="text/javascript" src="doWhileEx.js" ></script>
</body>
</html>

<!DOCTYPE html>
<html>
<head>
    <title>While Loop Ex</title>
    <style>
        body {
            font-family: Arial;
            background-color: #f4f6f8;
        }
        #heading{
            text-align: center;
        }
        .container {
            width: 500px;
            margin: 50px auto;
        }
        .box {
            background-color: white;
            padding: 20px;
            margin-bottom: 20px;
            border: 1px solid #ddd;
        }
        input {
            padding: 8px;
            margin: 5px;
        }
        button {
            padding: 8px 15px;
            margin: 5px;
        }
        p {
            font-weight: bold;
        }
    </style>
</head>
<body>
    <h2 id="heading">Examples of while Loop</h2>
<div class="container">
    <div class="box">
        <h2>Count Digits</h2>
        <input type="text" id="num1" placeholder="Enter number">
        <button onclick="countDigits()">Count</button>
        <p id="result1"></p>
    </div>
    <div class="box">
        <h2>Reverse Number</h2>
        <input type="text" id="num2" placeholder="Enter number">
        <button onclick="reverseNumber()">Reverse</button>
        <p id="result2"></p>
    </div>
</div>
<script type="text/javascript" src="whileLoopEx.js"></script>
</body>
</html>

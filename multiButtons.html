<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>

    <style>
        body {
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #f2f2f2;
            font-family: Arial, sans-serif;
        }

        .calculator {
            width: 350px;
            padding: 30px;
            background-color: white;
            border: 2px solid black;
            border-radius: 15px;
            box-shadow: 0 5px 15px gray;
        }

        h2 {
            text-align: center;
            margin-bottom: 25px;
        }

        .input-box {
            margin-bottom: 18px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-size: 16px;
        }

        input {
            width: 100%;
            height: 38px;
            box-sizing: border-box;
            padding-left: 10px;
            border: 1px solid gray;
            border-radius: 5px;
            font-size: 15px;
        }

        .buttons {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-top: 25px;
        }

        button {
            width: 55px;
            height: 38px;
            border: 2px solid black;
            border-radius: 8px;
            background-color: white;
            cursor: pointer;
            font-size: 13px;
        }

        button:hover {
            background-color: lightgray;
        }
    </style>
</head>

<body>

    <div class="calculator">

        <h2>Calculator</h2>

        <div class="input-box">
            <label>Enter num1:</label>
            <input type="text" id="n1" placeholder="Enter number">
        </div>

        <div class="input-box">
            <label>Enter num2:</label>
            <input type="text" id="n2" placeholder="Enter number">
        </div>

        <div class="input-box">
            <label>Result:</label>
            <input type="text" id="res">
        </div>

        <div class="buttons">
            <button onclick="addTwo()">Add</button>
            <button onclick="subTwo()">Sub</button>
            <button onclick="mulTwo()">Mul</button>
            <button onclick="divTwo()">Div</button>
            <button onclick="modTwo()">Mod</button>
        </div>

    </div>
<script type="text/javascript" src="multiButtons.js"></script>
</body>

</html>
